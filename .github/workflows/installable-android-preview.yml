name: ReVanced Manager installable debug preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installable-android-preview.yml
      - android/**
      - assets/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revanced-manager-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true
      - name: Install code-generation dependencies
        run: npm ci
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate translations
        run: dart run slang
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build installable debug APK
        run: flutter build apk --debug
      - name: Prepare release assets
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          [[ -n "$VERSION" ]] || VERSION="development"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-debug.apk "release-assets/ReVanced-Manager-${VERSION}-debug.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=preview-${VERSION}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Publish installable debug preview
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ReVanced Manager ${{ steps.meta.outputs.version }} — Debug installable preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Installable debug APK built from the repository's main branch. This preview is separate from the owner's semantic-release pipeline and is not a stable release. The Android debug signing key is ephemeral to the runner; uninstall a previous preview before installing a later one if Android rejects an in-place update.
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
